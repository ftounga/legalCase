spring:
  application:
    name: legalcase-backend
  profiles:
    active: dev
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:change-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:change-me}
            scope: openid, email, profile
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-url: http://localhost:4200
  mail:
    enabled: false
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  contact:
    team-email: ${CONTACT_TEAM_EMAIL:ai-legalcase@ng-itconsulting.com}
  pipeline:
    direct-analysis-threshold-chars: 600000
    limits:
      droit-du-travail:
        document:
          faits: 5
          points-juridiques: 3
          risques: 3
          questions-ouvertes: 3
          timeline: 0
        dossier:
          faits: 7
          points-juridiques: 5
          risques: 5
          questions-ouvertes: 5
          timeline: 5
          pieces-manquantes: 5
          points-procedure: 8
      droit-immigration:
        document:
          faits: 7
          points-juridiques: 4
          risques: 4
          questions-ouvertes: 3
          timeline: 0
        dossier:
          faits: 10
          points-juridiques: 6
          risques: 6
          questions-ouvertes: 5
          timeline: 8
          pieces-manquantes: 5
          points-procedure: 8
      droit-famille:
        document:
          faits: 5
          points-juridiques: 3
          risques: 3
          questions-ouvertes: 3
          timeline: 0
        dossier:
          faits: 7
          points-juridiques: 5
          risques: 4
          questions-ouvertes: 5
          timeline: 5
          pieces-manquantes: 5
          points-procedure: 8
  # SF-148-01 : enrichissement visuel Claude Vision — stratégie hybride signaux + config.
  # Désactivé par défaut. Activer progressivement via VISION_ENABLED=true par environnement.
  # Signal 1 (OCR pauvre < min-ocr-chars-per-page) : prioritaire — force vision même sur blacklist.
  # Signal 2 (whitelist domaine) : déclenche vision quand OCR est correct mais la pièce a de la valeur visuelle.
  # Blacklist : désactive vision quand OCR suffit (sauf signal 1).
  vision:
    enabled: ${VISION_ENABLED:false}
    min-ocr-chars-per-page: 40
    model: ${VISION_MODEL:claude-haiku-4-5-20251001}
    max-tokens: 600
    render-dpi: 150
    trigger-types-by-domain:
      DROIT_DU_TRAVAIL:
        - SMS
        - ATTESTATION
        - PHOTO
      DROIT_IMMIGRATION:
        - PHOTO
        - PIECE_IDENTITE
        - TITRE_DE_SEJOUR
        - PASSEPORT
        - VISA
        - RECEPISSE_PREFECTURE
      DROIT_FAMILLE:
        - PHOTO
        - SMS
        - ATTESTATION
        - ACTE_MARIAGE
    skip-types-by-domain:
      DROIT_DU_TRAVAIL:
        - CONTRAT
        - LETTRE
        - BULLETIN_PAIE
      DROIT_IMMIGRATION:
        - AVIS_IMPOSITION
        - QUITTANCE_LOYER
        - ATTESTATION_HEBERGEMENT
      DROIT_FAMILLE:
        - JUGEMENT_DIVORCE
        - LIVRET_FAMILLE
        - JUSTIFICATIF_REVENUS

  stripe:
    enabled: false
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # Price IDs des 3 plans Stripe (SOLO 99 € flat · TEAM 219 € graduated ·
    # PRO 429 € graduated — voir docs/features/F-123-repricing-v7/).
    price-id-solo: ${STRIPE_PRICE_ID_SOLO:}
    price-id-team: ${STRIPE_PRICE_ID_TEAM:}
    price-id-pro: ${STRIPE_PRICE_ID_PRO:}
    price-id-tokens-1m: ${STRIPE_PRICE_ID_TOKENS_1M:}
    price-id-tokens-5m: ${STRIPE_PRICE_ID_TOKENS_5M:}
    price-id-tokens-20m: ${STRIPE_PRICE_ID_TOKENS_20M:}
    price-id-ocr-500: ${STRIPE_PRICE_ID_OCR_500:}
    price-id-ocr-2000: ${STRIPE_PRICE_ID_OCR_2000:}
    price-id-ocr-8000: ${STRIPE_PRICE_ID_OCR_8000:}

rabbitmq:
  management:
    url: ${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
    vhost: ${RABBITMQ_VHOST:%2F}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:dev}
  traces-sample-rate: 0

anthropic:
  api-key: ${ANTHROPIC_API_KEY:change-me}
  model-fast: ${ANTHROPIC_MODEL_FAST:claude-haiku-4-5-20251001}

storage:
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minio}
    secret-key: ${S3_SECRET_KEY:minio123}
    bucket: ${S3_BUCKET:legalcase-dev}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}

aws:
  textract:
    enabled: ${AWS_TEXTRACT_ENABLED:false}
    region: ${AWS_TEXTRACT_REGION:eu-west-3}
    max-size-mb: ${AWS_TEXTRACT_MAX_SIZE_MB:5}
    max-pages: ${AWS_TEXTRACT_MAX_PAGES:11}
    max-concurrent-calls: ${AWS_TEXTRACT_MAX_CONCURRENT_CALLS:3}

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
