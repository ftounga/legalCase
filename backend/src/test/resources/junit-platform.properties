# F-245 SF-245-01 — active la découverte automatique des extensions JUnit 5
# déclarées via META-INF/services/org.junit.jupiter.api.extension.Extension.
# Permet d'appliquer DatabaseCleanupExtension à tous les tests sans modifier
# un seul fichier *IT.java / *Test.java.
junit.jupiter.extensions.autodetection.enabled=true
