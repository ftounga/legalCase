@if (step.target) {
  <div class="tour-backdrop"></div>
}

<div class="tour-card" [ngStyle]="cardStyle()">
  <div class="tour-card__header">
    <mat-icon class="tour-card__icon">{{ step.icon }}</mat-icon>
    <div class="tour-card__step-dots">
      @for (s of steps; track $index) {
        <span class="dot" [class.dot--active]="$index === tourService.currentStep()"></span>
      }
    </div>
  </div>

  <div class="tour-card__body">
    <h3 class="tour-card__title">{{ step.title }}</h3>
    <p class="tour-card__description">{{ step.description }}</p>
  </div>

  <div class="tour-card__actions">
    <button mat-button class="tour-card__skip" (click)="skip()">Passer</button>
    <button mat-flat-button color="primary" (click)="next()">
      {{ isLastStep ? 'Commencer' : 'Suivant' }}
    </button>
  </div>
</div>
