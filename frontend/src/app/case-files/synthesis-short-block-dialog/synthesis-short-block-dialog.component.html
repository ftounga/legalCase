<div class="dialog">
  <header class="dialog__header">
    <mat-icon class="dialog__icon" [class]="'dialog__icon ' + (data.iconClass ?? '')">{{ data.icon }}</mat-icon>
    <h2 mat-dialog-title class="dialog__title">{{ data.title }}</h2>
    <span class="dialog__count">{{ data.items.length }}</span>
  </header>

  <div mat-dialog-content class="dialog__content">
    @if (data.items.length === 0) {
      <p class="dialog__empty">Aucun élément.</p>
    } @else {
      <ol class="dialog__list">
        @for (item of data.items; track $index) {
          <li class="dialog__list-item">{{ item }}</li>
        }
      </ol>
    }
  </div>

  <div mat-dialog-actions align="end">
    <button mat-stroked-button (click)="close()">Fermer</button>
  </div>
</div>
