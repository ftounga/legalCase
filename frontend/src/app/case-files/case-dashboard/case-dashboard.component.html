@if (loading()) {
  <div class="dash-loading"><mat-spinner diameter="24"></mat-spinner><span>Chargement du tableau de bord…</span></div>
}

@if (!loading() && hasAnyData()) {
  <div class="dashboard">
    <h3 class="dash-title"><mat-icon class="dash-title-icon">dashboard</mat-icon> Tableau de bord décisionnel</h3>

    <div class="dash-grid">
      @for (tile of tiles(); track tile.toolId) {
        <app-decision-tool-card
          [toolId]="tile.toolId"
          [theme]="tile.theme"
          [icon]="tile.icon"
          [title]="tile.title"
          [summary]="tile.summary"
          [metierAlertLevel]="tile.metierAlertLevel ?? null"
          [disabled]="tile.disabled"
          (open)="openTile(tile)">
        </app-decision-tool-card>
      }
    </div>

    <!-- F-167 SF-167-01 : grid générique alimenté par dashboard.tiles ; coexiste
         avec le grid typé ci-dessus pendant la transition (fusion en SF-167-05). -->
    @if (genericTiles().length > 0) {
      <div class="generic-tiles-grid">
        @for (tile of genericTiles(); track tile.toolId) {
          <app-dashboard-tile
            [tile]="tile"
            (open)="openGenericTool($event)">
          </app-dashboard-tile>
        }
      </div>
    }
  </div>
}
