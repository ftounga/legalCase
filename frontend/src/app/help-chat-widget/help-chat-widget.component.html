@if (authService.currentUser()) {
  <div class="help-widget">

    @if (panelOpen()) {
      <div class="help-panel mat-elevation-z4">

        <div class="help-panel-header">
          <span class="help-panel-title">Aide</span>
          <button mat-icon-button (click)="closePanel()" aria-label="Fermer l'aide">
            <mat-icon>close</mat-icon>
          </button>
        </div>

        <div class="help-suggestions">
          @for (q of suggestedQuestions; track q) {
            <button mat-stroked-button class="suggestion-btn" (click)="sendSuggestion(q)" [disabled]="isLoading()">
              {{ q }}
            </button>
          }
        </div>

        <div class="help-content">
          @if (isLoading()) {
            <div class="help-loading">
              <mat-spinner diameter="28"></mat-spinner>
              <span>Réponse en cours...</span>
            </div>
          }

          @if (answer()) {
            <div class="help-answer">{{ answer() }}</div>
          }

          @if (errorMessage()) {
            <div class="help-error">{{ errorMessage() }}</div>
          }
        </div>

        <div class="help-input-area">
          <mat-form-field appearance="outline" class="help-input-field">
            <textarea
              matInput
              [(ngModel)]="message"
              placeholder="Votre question…"
              rows="2"
              [disabled]="isLoading()"
              (keydown.enter)="$event.preventDefault(); send()">
            </textarea>
            <mat-hint align="end" [class.hint-error]="message.length > 500">
              {{ message.length }}/500
            </mat-hint>
          </mat-form-field>
          <button
            mat-flat-button
            color="primary"
            class="send-btn"
            (click)="send()"
            [disabled]="!canSend"
            aria-label="Envoyer">
            <mat-icon>send</mat-icon>
          </button>
        </div>

      </div>
    }

    <button
      mat-fab
      color="primary"
      class="help-bubble"
      (click)="togglePanel()"
      aria-label="Ouvrir l'aide">
      <mat-icon>{{ panelOpen() ? 'close' : 'help_outline' }}</mat-icon>
    </button>

  </div>
}
