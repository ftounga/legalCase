<div class="timer-widget">
  @if (noRateConfigured()) {
    <div class="no-rate-warning">
      <mat-icon class="no-rate-icon">info_outline</mat-icon>
      <span>Votre taux horaire n'a pas encore été configuré. Contactez votre administrateur.</span>
    </div>
  } @else {
    <div class="timer-controls">
      @if (!activeEntry()) {
        <button
          mat-flat-button
          color="primary"
          class="timer-btn timer-btn--start"
          [disabled]="blockedByOtherTimer()"
          [matTooltip]="blockedByOtherTimer() ? 'Un timer est déjà actif sur un autre dossier' : ''"
          (click)="onStart()">
          <mat-icon>play_arrow</mat-icon>
          Démarrer le chrono
        </button>
      } @else {
        <div class="timer-running">
          <span class="timer-display">{{ formattedElapsed }}</span>
          <button
            mat-flat-button
            color="warn"
            class="timer-btn timer-btn--stop"
            (click)="onStop()">
            <mat-icon>stop</mat-icon>
            Arrêter
          </button>
        </div>
      }
    </div>
  }

  @if (totalSeconds() > 0) {
    <div class="timer-total">
      <span class="timer-total-label">Total enregistré sur ce dossier</span>
      <span class="timer-total-value">{{ formatDuration(totalSeconds()) }}</span>
    </div>
  }
</div>
