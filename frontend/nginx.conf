server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html et main.js — jamais mis en cache (pas de hash dans le nom)
    location ~* ^/(index\.html|main\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Fix SF-127-01 : nginx default mime.types n'a pas de mapping pour .mjs
    # → fallback application/octet-stream + X-Content-Type-Options nosniff
    # = le navigateur refuse d'exécuter le worker PDF.js. On force le MIME.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Chunks et assets hashés — cache long (1 an, immutable)
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|svg|jpg|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Angular routing — articles de blog (slugs dynamiques)
    # /blog et /blog/<slug> doivent fallback sur /blog/index.html (prerendere)
    # plutôt que sur /index.html (landing) pour que l'app shell rendu soit
    # BlogListPageComponent qui sait charger côté client le détail d'article
    # via le router Angular.
    # `location = /blog` (match exact) évite le 301 automatique de nginx vers
    # `/blog/` (qui en plus rebascule en http:// derrière le load balancer).
    # Cache-Control no-cache sur le HTML pour éviter qu'un navigateur garde
    # une version pre-fix d'hydratation (cas observé staging 2026-05-04).
    location = /blog {
        try_files /blog/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    location /blog/ {
        try_files $uri $uri/ /blog/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend
    location /api {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2 {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2 {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sécurité basique
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
