apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legalcase-ingress-legacy
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "INGRESSCOOKIE"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
    # F-143 SF-143-02 — bascule canonique 301 vers legalcase.fr.
    nginx.ingress.kubernetes.io/permanent-redirect: "https://legalcase.fr$request_uri"
spec:
  tls:
    - hosts:
        - legalcase.ng-itconsulting.com
      secretName: legalcase-tls-prod-legacy
  rules:
    - host: legalcase.ng-itconsulting.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legalcase-frontend
                port:
                  number: 80
