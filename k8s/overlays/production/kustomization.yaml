apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - rabbitmq-ingress.yaml

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - APP_FRONTEND_URL=https://legalcase.fr
      - APP_ALLOWED_FRONTEND_URLS=https://legalcase.fr,https://legalcase.ng-itconsulting.com
      - BLOG_PUBLIC_BASE_URL=https://legalcase.fr
      - AWS_TEXTRACT_ENABLED=true
      - AWS_TEXTRACT_REGION=eu-west-3
      # SF-INFRA-08 : CloudFront prod — placeholder à remplacer une fois
      # SF-INFRA-03 prod terminée (repo legalcase-infra). Tant que le
      # placeholder n'est pas remplacé OU que la ligne n'est pas commentée,
      # le pod backend prod refusera de démarrer (les secrets de signature
      # ne sont pas encore présents). Activation en 2 temps :
      # 1) ajouter CLOUDFRONT_KEY_PAIR_ID/CLOUDFRONT_PRIVATE_KEY au Secret
      #    backend-secrets via le workflow CI/CD ;
      # 2) remplacer le placeholder par le domaine CloudFront prod réel.
      - CLOUDFRONT_DOMAIN=dmnw3n9yylwnp.cloudfront.net

patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: legalcase-ingress
  - path: ingress-legacy-patch.yaml
    target:
      kind: Ingress
      name: legalcase-ingress-legacy
  - path: service-account-patch.yaml
    target:
      kind: ServiceAccount
      name: legalcase-backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: legalcase-backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: legalcase-frontend
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: legalcase-backend

commonLabels:
  environment: production
