apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base
  - rabbitmq-ingress.yaml

namePrefix: ""

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - APP_FRONTEND_URL=https://staging.legalcase.fr
      - APP_ALLOWED_FRONTEND_URLS=https://staging.legalcase.fr,https://staging.legalcase.ng-itconsulting.com
      - BLOG_PUBLIC_BASE_URL=https://staging.legalcase.fr
      - AWS_TEXTRACT_ENABLED=true
      - AWS_TEXTRACT_REGION=eu-west-3
      # SF-INFRA-08 : CloudFront devant le bucket S3 documents staging
      # (cf. SF-INFRA-03 dans repo legalcase-infra). Domaine staging :
      #   d2oaldre5efpif.cloudfront.net
      #
      # ACTIVATION EN 2 TEMPS (cf. mini-spec SF-INFRA-08 §Pré-requis runtime) :
      #   1) Provisionner la CloudFront Key Pair (Terraform legalcase-infra)
      #      et alimenter les GitHub secrets CLOUDFRONT_KEY_PAIR_ID +
      #      CLOUDFRONT_PRIVATE_KEY (cf. .github/workflows/backend.yml).
      #   2) Décommenter la ligne CLOUDFRONT_DOMAIN ci-dessous et re-déployer.
      #
      # Tant que la ligne reste commentée, le backend retombe sur les URLs
      # S3 présignées natives (comportement historique). Pas de régression.
      - CLOUDFRONT_DOMAIN=d2oaldre5efpif.cloudfront.net
      # F-JU-01 : citations jurisprudentielles auto-pilot Claude.
      # Activé staging 2026-05-24 (compte OAuth2 PISTE + bootstrap initial mappings).
      # Active aussi le cron mensuel JurisprudenceWatchScheduler côté backend.
      # Reste désactivé en production tant que le bootstrap staging n'a pas été validé.
      - JURISPRUDENCE_WATCH_ENABLED=true

patches:
  - path: service-account-patch.yaml
    target:
      kind: ServiceAccount
      name: legalcase-backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: legalcase-backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: legalcase-frontend

commonLabels:
  environment: staging
