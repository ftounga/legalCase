apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  RABBITMQ_MANAGEMENT_URL: "http://rabbitmq:15672"
  RABBITMQ_VHOST: "/"
  S3_REGION: "eu-west-3"
  S3_PATH_STYLE_ACCESS: "false"
  APP_FRONTEND_URL: "https://staging.legalcase.ng-itconsulting.com"
  MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
  APP_STRIPE_ENABLED: "true"
  APP_MAIL_ENABLED: "true"
  ANTHROPIC_MODEL: "claude-sonnet-4-6"
  ANTHROPIC_MODEL_FAST: "claude-haiku-4-5-20251001"
  BLOG_SCHEDULER_ENABLED: "true"
  # F-148 : enrichissement visuel Claude Vision multimodale.
  # Activé sur tous les environnements depuis 2026-05-09 (était patché in-place
  # sur staging uniquement, oubli en prod corrigé via F-230 + F-231).
  VISION_ENABLED: "true"
