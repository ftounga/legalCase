apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legalcase-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "55m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - staging.legalcase.fr
      secretName: legalcase-tls
  rules:
    - host: staging.legalcase.fr
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: legalcase-backend
                port:
                  number: 8080
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: legalcase-backend
                port:
                  number: 8080
          - path: /login/oauth2
            pathType: Prefix
            backend:
              service:
                name: legalcase-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legalcase-frontend
                port:
                  number: 80
---
# F-143 SF-143-02 — bascule canonique 301
# Ingress dédié à l'ancien host : redirige 301 vers staging.legalcase.fr en
# préservant path + query string ($request_uri).
# Conserve son propre cert TLS (legalcase-tls-legacy) tant que cert-manager
# peut renouveler le challenge HTTP-01 — i.e. tant que le DNS de l'ancien
# host pointe vers le cluster.
# Désactivation totale = action ops post-merge à J+14 à J+28 :
#   kubectl delete ingress legalcase-ingress-legacy -n staging
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legalcase-ingress-legacy
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://staging.legalcase.fr$request_uri"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - staging.legalcase.ng-itconsulting.com
      secretName: legalcase-tls-legacy
  rules:
    - host: staging.legalcase.ng-itconsulting.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legalcase-frontend
                port:
                  number: 80
