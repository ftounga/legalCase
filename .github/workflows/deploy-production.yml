name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: 'Backend image tag (ex: 1.0.0)'
        required: true
      frontend_tag:
        description: 'Frontend image tag (ex: 1.0.0)'
        required: true
      confirm:
        description: 'Tapez "PRODUCTION" pour confirmer'
        required: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REPOSITORY_FRONTEND: legalcase-frontend

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'PRODUCTION'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend with production config
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          FRONTEND_TAG: ${{ github.event.inputs.frontend_tag }}
        run: |
          PROD_TAG=${FRONTEND_TAG}-prod
          docker build --build-arg BUILD_CONFIGURATION=production \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$PROD_TAG \
                       ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$PROD_TAG
          echo "prod_tag=$PROD_TAG" >> $GITHUB_OUTPUT

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Fetch production DB credentials from Secrets Manager
        id: db-creds
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "legalcase/production/rds/credentials" \
            --region ${{ env.AWS_REGION }} \
            --query 'SecretString' \
            --output text)
          DB_USER=$(echo "$SECRET" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['username'])")
          DB_PASS=$(echo "$SECRET" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['password'])")
          DB_HOST=$(echo "$SECRET" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['host'])")
          DB_NAME=$(echo "$SECRET" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['dbname'])")
          echo "::add-mask::$DB_PASS"
          echo "DB_USERNAME=$DB_USER" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASS" >> $GITHUB_ENV
          echo "DB_URL=jdbc:postgresql://$DB_HOST:5432/$DB_NAME" >> $GITHUB_ENV

      - name: Create/update backend K8s secret (production)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID_SOLO: ${{ secrets.STRIPE_PRICE_ID_SOLO }}
          STRIPE_PRICE_ID_TEAM: ${{ secrets.STRIPE_PRICE_ID_TEAM }}
          STRIPE_PRICE_ID_PRO: ${{ secrets.STRIPE_PRICE_ID_PRO }}
          STRIPE_PRICE_ID_TOKENS_1M: ${{ secrets.STRIPE_PRICE_ID_TOKENS_1M }}
          STRIPE_PRICE_ID_TOKENS_5M: ${{ secrets.STRIPE_PRICE_ID_TOKENS_5M }}
          STRIPE_PRICE_ID_TOKENS_20M: ${{ secrets.STRIPE_PRICE_ID_TOKENS_20M }}
          STRIPE_PRICE_ID_OCR_500: ${{ secrets.STRIPE_PRICE_ID_OCR_500 }}
          STRIPE_PRICE_ID_OCR_2000: ${{ secrets.STRIPE_PRICE_ID_OCR_2000 }}
          STRIPE_PRICE_ID_OCR_8000: ${{ secrets.STRIPE_PRICE_ID_OCR_8000 }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          S3_BUCKET: legalcase-production-documents-504895205419
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          # SF-INFRA-08 : signature CloudFront URLs téléchargement documents.
          # Secrets optionnels — si vides, le backend retombe sur S3 présignées.
          # Pour activer prod, alimenter ces deux secrets PUIS décommenter
          # CLOUDFRONT_DOMAIN dans k8s/overlays/production/kustomization.yaml.
          CLOUDFRONT_KEY_PAIR_ID: ${{ secrets.CLOUDFRONT_KEY_PAIR_ID }}
          CLOUDFRONT_PRIVATE_KEY: ${{ secrets.CLOUDFRONT_PRIVATE_KEY }}
        run: |
          kubectl create secret generic backend-secrets \
            --namespace=production \
            --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --from-literal=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            --from-literal=MICROSOFT_CLIENT_ID="$MICROSOFT_CLIENT_ID" \
            --from-literal=MICROSOFT_CLIENT_SECRET="$MICROSOFT_CLIENT_SECRET" \
            --from-literal=STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            --from-literal=STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
            --from-literal=STRIPE_PRICE_ID_SOLO="$STRIPE_PRICE_ID_SOLO" \
            --from-literal=STRIPE_PRICE_ID_TEAM="$STRIPE_PRICE_ID_TEAM" \
            --from-literal=STRIPE_PRICE_ID_PRO="$STRIPE_PRICE_ID_PRO" \
            --from-literal=STRIPE_PRICE_ID_TOKENS_1M="$STRIPE_PRICE_ID_TOKENS_1M" \
            --from-literal=STRIPE_PRICE_ID_TOKENS_5M="$STRIPE_PRICE_ID_TOKENS_5M" \
            --from-literal=STRIPE_PRICE_ID_TOKENS_20M="$STRIPE_PRICE_ID_TOKENS_20M" \
            --from-literal=STRIPE_PRICE_ID_OCR_500="$STRIPE_PRICE_ID_OCR_500" \
            --from-literal=STRIPE_PRICE_ID_OCR_2000="$STRIPE_PRICE_ID_OCR_2000" \
            --from-literal=STRIPE_PRICE_ID_OCR_8000="$STRIPE_PRICE_ID_OCR_8000" \
            --from-literal=MAIL_HOST="$MAIL_HOST" \
            --from-literal=MAIL_USERNAME="$MAIL_USERNAME" \
            --from-literal=MAIL_PASSWORD="$MAIL_PASSWORD" \
            --from-literal=MAIL_FROM="$MAIL_FROM" \
            --from-literal=SPRING_DATASOURCE_USERNAME="$DB_USERNAME" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
            --from-literal=SPRING_DATASOURCE_URL="$DB_URL" \
            --from-literal=S3_BUCKET="$S3_BUCKET" \
            --from-literal=S3_ACCESS_KEY="$S3_ACCESS_KEY" \
            --from-literal=S3_SECRET_KEY="$S3_SECRET_KEY" \
            --from-literal=SPRING_RABBITMQ_USERNAME="$RABBITMQ_USER" \
            --from-literal=SPRING_RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
            --from-literal=CLOUDFRONT_KEY_PAIR_ID="$CLOUDFRONT_KEY_PAIR_ID" \
            --from-literal=CLOUDFRONT_PRIVATE_KEY="$CLOUDFRONT_PRIVATE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/update RabbitMQ K8s secret (production)
        env:
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          kubectl create secret generic rabbitmq-secrets \
            --namespace=production \
            --from-literal=RABBITMQ_USER="$RABBITMQ_USER" \
            --from-literal=RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to production
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          BACKEND_TAG: ${{ github.event.inputs.backend_tag }}
          FRONTEND_TAG: ${{ github.event.inputs.frontend_tag }}
        run: |
          find k8s/ -name "*.yaml" | xargs sed -i \
            "s|REGISTRY_PLACEHOLDER|$ECR_REGISTRY|g"

          sed -i "s|legalcase-backend:BACKEND_IMAGE_TAG|legalcase-backend:$BACKEND_TAG|g" \
            k8s/base/backend/deployment.yaml
          sed -i "s|legalcase-frontend:FRONTEND_IMAGE_TAG|legalcase-frontend:${{ steps.build-frontend.outputs.prod_tag }}|g" \
            k8s/base/frontend/deployment.yaml

          # SF-123-05 : injecter un hash des secrets → force rollout si secrets changent
          SECRETS_HASH=$(kubectl -n production get secret backend-secrets -o yaml \
            | sha256sum | cut -d' ' -f1 | head -c 16)
          sed -i "s|SECRETS_HASH_PLACEHOLDER|$SECRETS_HASH|g" k8s/base/backend/deployment.yaml

          kubectl apply -k k8s/overlays/production/
          kubectl rollout status deployment/legalcase-backend -n production --timeout=10m || \
            (kubectl describe pods -n production -l app=legalcase-backend && \
             kubectl logs -n production -l app=legalcase-backend --tail=50 && exit 1)
          kubectl rollout status deployment/legalcase-frontend -n production --timeout=10m

      - name: Health check
        run: |
          sleep 10
          curl -sf https://legalcase.ng-itconsulting.com/api/actuator/health \
            || (echo "Health check failed after production deploy" && exit 1)
